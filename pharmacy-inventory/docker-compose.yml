services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: pharmacy_inventory
      MYSQL_USER: pharmacy
      MYSQL_PASSWORD: pharmacy
      MYSQL_ROOT_PASSWORD: local-root-password
    ports:
      - "3307:3306"
    volumes:
      - pharmacy_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-upharmacy", "-ppharmacy"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  pharmacy_mysql_data:
